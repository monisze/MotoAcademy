<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="paragrafo"> Olá, mundo Monise</p>
    <button id="mudarEstiloBotao">Mudar</button>

   <!--  <script >
        document.geElementById('mudarCorBotao').addEventListener('click', ()=> {
            document.body.style.backgroundColor = 'blue'
        })
    </script> -->

<script>
    document.getElementById("mudarEstiloBotao").addEventListener('click', function(){
        const texto = document.getElementById('paragrafo')
        texto.style.color = 'red'
        texto.style.fontSize = '50px'
        texto.style.fontWeight = 'bold'
    } )
</script>

</body>
</html>
